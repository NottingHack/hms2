networks:
    hms:
        driver:  bridge
        enable_ipv6: false

volumes:
  hms-shared:
  hms-mariadb:
  hms-krb5:

x-hms-environment: &hms-environment
  DB_HOST: hms-mysql
  DB_USERNAME: root
  DB_PASSWORD: ""
  REDIS_HOST: hms-redis
  KRB_USERNAME: hms/admin
  KRB_REALM: NOTTINGHACK
  KRB_KEYTAB: /shared/hms.keytab
  KRB5_CONFIG: /shared/krb5.conf
  FONTAWESOME_TOKEN: ${FONTAWESOME_TOKEN}

services:
  hms-web:
    image: hms-php-nginx
    pull_policy: never
    build:
      dockerfile: dev/Dockerfile.nginx
    ports:
      - "8080:8080"
    networks:
      - hms
    user: nobody
    volumes:
      - ./:/var/www
      - ./public:/var/www/html
      - hms-shared:/shared
    environment:
      <<: *hms-environment

  hms-mailpit:
    image: ghcr.io/axllent/mailpit:v1.30.3
    networks:
      - hms
    ports:
      - "1025:1025"
      - "8025:8025"

  hms-mysql:
    image: mariadb:latest
    ports:
      - "3306:3306"
    networks:
      - hms
    volumes:
      - hms-mariadb:/var/lib/mysql:Z
      - ./dev/docker-init.sql:/docker-init.sql
    command: --init-file /docker-init.sql
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1

  hms-redis:
    image: redis:latest
    networks:
      - hms

  hms-memcached:
    image: memcached:trixie
    networks:
      - hms

  hms-krb5:
    image: gcavalcante8808/krb5-server
    networks:
      - hms
    volumes:
      - hms-shared:/shared:rw
      - hms-krb5:/var/lib/krb5kdc:rw
    environment:
      KRB5_REALM: NOTTINGHACK
      KRB5_KDC: localhost
      KRB5_ADMINSERVER: localhost
      KRB5_PASS: very-secure-passwords

  hms-db-init:
    image: hms-php-nginx
    pull_policy: never
    command: /docker-init.sh
    user: nobody
    networks:
      - hms
    environment:
      <<: *hms-environment
    volumes:
      - ./dev/docker-hms-init.sh:/docker-init.sh
      - ./:/hms
      - hms-shared:/shared
    depends_on:
      hms-mysql:
        condition: service_started
      hms-web:
        condition: service_healthy

  hms-krb5-init:
    image: gcavalcante8808/krb5-server
    command: /docker-init.sh
    networks:
      - hms
    volumes:
      - ./dev/docker-krb5-init.sh:/docker-init.sh
      - hms-shared:/shared
    depends_on:
      hms-krb5:
        condition: service_started

  hms-pma:
    image: phpmyadmin
    ports:
      - 8081:80
    networks:
      - hms
    environment:
      - PMA_HOST=hms-mysql
